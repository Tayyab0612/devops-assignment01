services:
  mongo_ci:
    image: mongo:6
    container_name: shopzone_mongo_ci
    restart: unless-stopped
    volumes:
      - mongo_data_ci:/data/db

  app_ci:
    image: node:18-alpine
    container_name: shopzone_app_ci
    working_dir: /usr/src/app
    restart: unless-stopped
    depends_on:
      - mongo_ci
    volumes:
      - ./:/usr/src/app
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo_ci:27017/ecommerce
      - SESSION_SECRET=devops_assignment_secret
      - GOOGLE_CLIENT_ID=dummy
      - GOOGLE_CLIENT_SECRET=dummy
      - GOOGLE_CALLBACK_URL=http://localhost/auth/google/callback
    command: sh -c "npm install --omit=dev && npm start"

volumes:
  mongo_data_ci:
